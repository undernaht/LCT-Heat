# Правила конкурсной модели — Техническое приложение к кейсу ЛЦТ 2026.
#
# Это НЕ наши оценки и НЕ нормативы СП: это формальная модель, по которой
# решение будет проверяться программно. Числа менять нельзя, кроме случая,
# когда организаторы выпустят новую редакцию приложения. Наши трактовки
# неоднозначностей — docs/07-case-model.md §9.

meta:
  source: "Техническое приложение к кейсу «Сервис моделирования трасс подключения к тепловым сетям», ЛЦТ 2026"
  calc_crs: "EPSG:32637"
  input_crs: "EPSG:4326"

# ---------------------------------------------------------------------------
# Таблица 1: Ду → [пропускная способность т/ч, предельная длина м, ₽/м,
# ширина пары м, высота м]
# ---------------------------------------------------------------------------
diameters:
  50:   [3.5,     181,   74023,  0.400, 0.125]
  65:   [8.3,     245,   78631,  0.430, 0.140]
  80:   [13.2,    327,   83530,  0.470, 0.160]
  100:  [22.3,    419,   89748,  0.510, 0.180]
  125:  [40.2,    554,   97275,  0.600, 0.225]
  150:  [65.1,    696,   105507, 0.650, 0.250]
  200:  [152.3,   1042,  120275, 0.880, 0.315]
  250:  [274.9,   1379,  135323, 1.050, 0.400]
  300:  [437.4,   1718,  150022, 1.150, 0.450]
  400:  [943.1,   2477,  190299, 1.370, 0.560]
  500:  [1663.4,  3245,  224137, 1.670, 0.710]
  600:  [2627.7,  4037,  264790, 1.850, 0.800]
  700:  [3735.1,  4775,  324298, 2.050, 0.900]
  800:  [5296.8,  5644,  325996, 2.250, 1.000]
  900:  [7165.0,  6518,  327693, 2.450, 1.100]
  1000: [9391.8,  7419,  418777, 2.650, 1.200]
  1200: [15012.8, 9288,  428074, 3.100, 1.425]
  1400: [22501.9, 11276, 683417, 3.450, 1.600]

# ---------------------------------------------------------------------------
# §3.2 приложения: камеры и врезки
# ---------------------------------------------------------------------------
chambers:
  # [Ду от, Ду до, стоимость новой камеры] — по наибольшему Ду примыкающих участков
  cost_by_max_du:
    - [50,   200,  3000000]
    - [250,  500,  5000000]
    - [600,  1000, 8000000]
    - [1200, 1400, 12000000]
  max_connections: 4
  # §2.4: точка присоединения не далее 10 м от существующей камеры → камера используется
  reuse_existing_within_m: 10.0
  # врезка в существующую камеру, за каждый новый участок, заканчивающийся в ней
  tie_in_cost: 5000000
  # §9.12 спецификации: участок примыкает к камере, если его конец ближе этого
  attach_tolerance_m: 0.5
  # §9.3 спецификации: Ду новой камеры на существующем участке считать по
  # наибольшему Ду включая сам существующий участок (влияет на топологию!)
  chamber_diameter_includes_existing: true

# ---------------------------------------------------------------------------
# §6 приложения: штраф и показатель
# ---------------------------------------------------------------------------
penalty:
  fixed: 100000000
  per_tph: 500000

score:
  cost_weight: 0.7
  cost_scale: 25000000
  length_weight: 0.3
  length_scale: 100

# ---------------------------------------------------------------------------
# Таблица 2: ограничения.
#   rule: block   — пересечение запрещено, только обход с отступом
#   rule: special — пересечение спецпроходом (один прямой участок), Kспец
#   clearance_m   — минимальное горизонтальное расстояние до внешней границы
#                   габарита новой сети
#   margin_m      — границы спецучастка за пределами объекта (с каждой стороны)
#   min_angle_deg — минимальный угол пересечения
#   gauge         — собственный габарит объекта (расстояние — между габаритами)
#   depth         — условия режима с глубиной
# ---------------------------------------------------------------------------
restrictions:
  oks:
    rule: block
    clearance_m: 5.0
    # отступ зависит от Ду новой сети: [Ду от, Ду до, отступ]
    clearance_by_du:
      - [50,   400,  5.0]
      - [500,  800,  7.0]
      - [900,  1400, 9.0]
  park:
    rule: block
    clearance_m: 1.0
  social_area:
    rule: block
    clearance_m: 1.0
  prohibited_site:
    rule: block
    clearance_m: 1.0
  water:
    rule: block
    clearance_m: 1.0
  railway:
    rule: block
    clearance_m: 1.0
  road:
    rule: special
    clearance_m: 1.5
    min_angle_deg: 45
    margin_m: 3.0
    k_special: 1.60
    depth: { kind: below, min_top_depth_m: 1.0 }
  tram_tracks:
    rule: special
    clearance_m: 1.5
    min_angle_deg: 45
    margin_m: 3.0
    k_special: 1.75
    depth: { kind: below, min_top_depth_m: 1.2 }
  gas_pipeline:
    rule: special
    clearance_m: 2.0
    margin_m: 2.0
    k_special: 1.25
    gauge: { width_m: 0.40, height_m: 0.40, top_depth_m: 2.8 }
    depth: { kind: above_or_below, clearance_m: 0.2 }
  power_cable:
    rule: special
    clearance_m: 2.0
    margin_m: 2.0
    k_special: 1.15
    gauge: { width_m: 0.20, height_m: 0.20, top_depth_m: 2.7 }
    depth: { kind: above_or_below, clearance_m: 0.5 }
  # Существующая теплосеть — не restriction во входе, а heat_network; правило
  # применяется к пересечению без врезки. Габарит — по таблице 1 для её Ду.
  heat_network:
    rule: special
    clearance_m: 1.0
    margin_m: 2.0
    k_special: 1.05
    gauge: { by_diameter: true, top_depth_m: 3.0 }
    depth: { kind: above_or_below, clearance_m: 0.5 }

# Синонимы restriction_type → канонический тип. Пусто: в приложении типы
# заданы явно. Заполняется, если проверочный набор придёт с другими именами.
aliases: {}

# ---------------------------------------------------------------------------
# §5 приложения: режим с учётом глубины (необязательный)
# ---------------------------------------------------------------------------
depth:
  normal_top_depth_m: 3.0
  min_top_depth_m: 0.7
  max_slope: 0.10
  # Kгл = 1 + k · (h − 3) при h > 3
  k_per_m_below_normal: 0.10

# ---------------------------------------------------------------------------
# Параметры нашего поиска — не правила кейса, а как мы их соблюдаем.
# ---------------------------------------------------------------------------
search:
  # §9.1 спецификации: если ближайшая граница полигона непроходима —
  # lenient: брать следующую точку контура (помечая approach_rule=fallback);
  # strict: считать точку неподключённой.
  approach_fallback: lenient
  # §9.7: запасы к пределам приложения, чтобы округление не дало нарушения
  max_turn_deg: 89.9
  min_crossing_angle_deg: 45.5
  resolution_m: 1.0          # шаг сетки; для больших районов растёт автоматически
  max_cells: 12000000        # выше — шаг сетки увеличивается
  aoi_margin_m: 150.0        # запас сетки вокруг охвата объектов
  # Следование вдоль спецпроходного ограничения запрещено (§9.9 спецификации):
  # растр этого не выражает, поэтому полоса отступа делается дорогой, а
  # нарушения ловятся постфактум и запрещаются точечно.
  special_band_penalty: 2.0  # множитель к стоимости внутри полосы отступа
  max_repair_passes: 3
  # effort=thorough: сколько точек переставить в конец порядка у лучшего варианта
  reinsertion_trials: 5
  # Перестройка веток при остальных как есть — в каждом варианте; 0 — выключить
  branch_rebuild_rounds: 2
  # §9.7 спецификации: критерии «зигзага»
  min_segment_m: 3.0
  step_detect_m: 10.0
