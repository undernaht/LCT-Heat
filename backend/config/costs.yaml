# Расценки для поля стоимости и сметы.
#
# МОДЕЛЬ СТОИМОСТИ — аддитивная, всё в рублях на метр трассы:
#
#   cost_per_m(x,y) = pipe(Ду, способ)                 постоянна вдоль трассы
#                   + earthwork(Ду) × surface_mult(x,y)  зависит от покрытия
#                   + penalty(x,y)                       надбавки зон
#
# Почему не мультипликативная модель: покрытие удорожает земляные работы и
# восстановление, но не стоимость самой трубы. Множитель на всю сумму завышал бы
# цену трубы под асфальтом — экономически неверно и ломает сравнение вариантов.
#
# ⚠️ КАЛИБРОВКА: цифры — укрупнённые ориентиры порядка величины, не сметные
# расценки. Структура важнее значений: подставить прайс ТСО = править только этот
# файл. Перед защитой сверить хотя бы ставки труб и ГНБ.

meta:
  currency: RUB
  price_level: "2026, ориентировочно"
  calibrated: false

# ---------------------------------------------------------------------------
# Труба + монтаж, ₽/м трассы. Двухтрубная прокладка (подающий + обратный).
# ---------------------------------------------------------------------------
pipe_per_m:
  channelless:        # ППУ, бесканальная — базовый способ
    32:   9000
    40:  10500
    50:  12500
    65:  15000
    80:  18000
    100: 21000
    125: 24500
    150: 28000
    200: 36000
    250: 45000
    300: 55000
    350: 66000
    400: 78000
    500: 100000
  channel_factor: 1.5    # канальная: лоток, плиты перекрытия, гидроизоляция
  overhead_factor: 0.8   # надземная: нет траншеи, но нужны опоры

# ---------------------------------------------------------------------------
# Земляные работы и восстановление, ₽/м трассы, в грунте (множитель 1.0).
# Растёт с диаметром: шире и глубже траншея.
#
# Ставка считает траншею МИНИМАЛЬНОЙ глубины (нормативное заглубление плюс
# высота конструкции). Всё, что глубже — из-за уклона и рельефа, — идёт
# отдельной строкой `terrain.excavation_extra_rub_per_m3` по объёму из профиля,
# иначе рельеф был бы посчитан дважды.
# ---------------------------------------------------------------------------
earthwork_per_m:
  base_by_du:
    32:  6000
    50:  7000
    80:  9000
    100: 10500
    150: 13000
    200: 16000
    300: 22000
    500: 32000

# Геометрия улиц: ширина проезжей части и класс покрытия по тегу OSM highway.
# Отсюда строятся полигоны покрытий для поля стоимости.
road_geometry:
  motorway:      {width_m: 22.0, surface: street_major, closed_crossing: true}
  trunk:         {width_m: 20.0, surface: street_major, closed_crossing: true}
  primary:       {width_m: 18.0, surface: street_major, closed_crossing: true}
  secondary:     {width_m: 14.0, surface: street_major, closed_crossing: true}
  tertiary:      {width_m: 11.0, surface: street_local, closed_crossing: false}
  unclassified:  {width_m:  8.0, surface: street_local, closed_crossing: false}
  residential:   {width_m:  7.0, surface: street_local, closed_crossing: false}
  living_street: {width_m:  5.5, surface: yard,         closed_crossing: false}
  service:       {width_m:  4.5, surface: yard,         closed_crossing: false}
  pedestrian:    {width_m:  4.0, surface: sidewalk,     closed_crossing: false}
# Тротуар вдоль улицы: полоса такой ширины сразу за проезжей частью.
sidewalk_width_m: 2.5

# ---------------------------------------------------------------------------
# Рельеф
# ---------------------------------------------------------------------------
terrain:
  # Земляные работы на склоне дороже: террасирование, крепление, вывоз грунта.
  # Множитель = 1 + factor × уклон. При уклоне 0,2 (11°) выходит ×1,5.
  slope_cost_factor: 2.5
  # Круче этого прокладка требует особых решений — считаем непроходимым.
  # 0,45 ≈ 24°, для городской застройки это уже откос или подпорная стена.
  max_slope: 0.45
  # Выемка сверх той, что заложена в базовую ставку земляных работ. Возникает
  # там, где ради уклона трубу приходится заглублять ниже минимума.
  excavation_extra_rub_per_m3: 2800

# Множитель земляных работ по типу покрытия.
surface_multiplier:
  ground:        1.0     # грунт, пустырь
  lawn:          1.1     # газон, восстановление озеленения
  sidewalk:      1.6     # тротуар, плитка
  yard:          2.0     # дворовый проезд, асфальт + согласование с УК
  street_local:  3.0     # улица местного значения
  street_major:  4.5     # магистральная улица (открытым способом — крайний случай)
  utility_corridor: 0.85 # существующий техкоридор: коридор есть, согласования проще

# ---------------------------------------------------------------------------
# Надбавки зон, ₽/м трассы. Аддитивны.
#
# КЛЮЧЕВОЙ ПРИЁМ (см. docs/04-algorithm.md §4.3): полоса нормативного отступа от
# чужой сети получает высокую, но КОНЕЧНУЮ надбавку. Тогда пересечь её поперёк
# можно (3 м × 250 000 = 750 тыс ₽ — сопоставимо с обходом в 30 м), а идти вдоль
# неё нельзя (200 м × 250 000 = 50 млн ₽). Направленная анизотропия не нужна:
# скалярное поле само разделяет пересечение и следование, потому что стоимость
# накапливается по длине.
#
# ⚠️ ЭТО ВЕСА ПОИСКА, А НЕ СМЕТНЫЕ РАСЦЕНКИ. В смету они НЕ входят: там
# пересечения считаются поштучно по `crossing_setup` и `crossing_per_m` (ниже).
#
# КАЛИБРОВКА. Веса должны быть достаточно велики, чтобы запретить следование
# вдоль чужой сети, но не настолько, чтобы трассировщик платил лишней трубой за
# уклонение от пересечений. Первая версия (250 000 ₽/м) завышала цену пересечения
# всемеро: на `persp_3` трассировщик увёл трассу на 126 м в обход (≈4,5 млн ₽),
# лишь бы не пересечь одну сеть, которая в смете стоит 120 тыс ₽.
#
# Правило калибровки: `надбавка × ширина полосы ≈ сметная стоимость пересечения`,
# и при этом `надбавка × 20 м` заведомо дороже любого разумного обхода.
#   40 000 × 3,5 м = 140 тыс ₽ ≈ 120 тыс ₽ сметных — пересечение не переоценено;
#   40 000 × 200 м = 8 млн ₽   ≫ обход в 100 м (3,6 млн) — следование запрещено.
# Первая версия ставила 250 000 ₽/м: следование она запрещала так же, но
# пересечение оценивала всемеро дороже сметы, и трассировщик уводил трассу
# на сотню метров в обход ради экономии ста тысяч рублей.
# ---------------------------------------------------------------------------
zone_penalty_per_m:
  utility_offset:      40000   # полоса нормативного отступа от чужой сети
  kerb_offset:         60000   # 1,5 м от бортового камня (СП 124.13330, табл. А.3)
  road_closed_method:  80000   # проезжая часть: только прокол / ГНБ
  rail_corridor:      100000   # полоса отвода ж/д: только ГНБ в футляре
  private_parcel:      35000   # чужой участок — «стоимость согласований», сметного аналога нет
  protected_zone:      60000   # ЗОУИТ, где прокладка возможна с ограничениями
  # Зона вокруг ствола дерева. Дерево не абсолютное препятствие — его можно
  # снести, оплатив компенсационную стоимость озеленения. Отсюда надбавка, а не
  # запрет: обойти дерево дешевле, но если обход дорогой, снос допустим.
  greenery_offset:     70000

# Пересечения — СМЕТНЫЕ расценки, считаются поштучно по фактической геометрии
# трассы. Фиксированная часть за переход (мобилизация, приямки, футляр):
crossing_setup:
  hdd_road:         350000     # ГНБ под улицей
  hdd_rail:         900000     # ГНБ под ж/д, футляр
  puncture:         180000     # прокол под второстепенным проездом
  utility_crossing: 120000     # пересечение чужой сети: защитные мероприятия, футляр
  tree_removal:      95000     # снос дерева с компенсационной стоимостью озеленения
  open_trench:           0
# Переменная часть — за метр длины перехода:
crossing_per_m:
  hdd_road:      45000
  hdd_rail:      60000
  puncture:      22000

# ---------------------------------------------------------------------------
# Узлы
# ---------------------------------------------------------------------------
nodes:
  chamber_by_du:               # тепловая камера, ₽
    100:  650000
    200:  900000
    300: 1400000
    500: 2300000
  tap_in_by_du:                # врезка в существующий трубопровод, ₽
    100:  480000
    200:  760000
    300: 1200000
    500: 2000000
  # Интервал расстановки камер. 100 м давало 4 камеры на 450-метровое
  # ответвление и 11 % сметы — для распределительной сети это вдвое чаще, чем
  # ставят в проектах: камеры нужны на врезке, на ответвлениях и в местах
  # установки арматуры, а не через каждые сто метров.
  chamber_interval_m: 200

# ---------------------------------------------------------------------------
# Реконструкция существующего участка при нехватке пропускной способности:
# перекладка на следующий диаметр. ₽/м = pipe(новый Ду) + earthwork + демонтаж.
# ---------------------------------------------------------------------------
reconstruction:
  dismantling_per_m: 4500
  surface_multiplier_default: 2.0   # существующие сети чаще всего под проездами

# ---------------------------------------------------------------------------
# Эксплуатационные затраты — для сравнения вариантов по совокупной стоимости
# ---------------------------------------------------------------------------
opex:
  lifetime_years: 25
  discount_rate: 0.12
  heat_tariff_rub_per_gcal: 2900
  # Нормированная линейная плотность теплового потока, Вт/м (подающий+обратный),
  # бесканальная прокладка ППУ, среднегодовая температура теплоносителя.
  heat_loss_w_per_m:
    32:  16
    50:  21
    80:  28
    100: 33
    150: 44
    200: 55
    300: 78
    500: 115

# ---------------------------------------------------------------------------
# ПЛАТА ЗА ПОДКЛЮЧЕНИЕ — то, что фактически платит застройщик.
#
# Основание: ФЗ-190 «О теплоснабжении», ст. 14; Правила подключения — ПП РФ
# № 787 от 05.07.2018. Плата двухставочная: ставка за подключаемую тепловую
# нагрузку плюс ставка за протяжённость сетей, дифференцированная по диаметрам
# и типу прокладки. Именно поэтому оптимизатор минимизирует ровно ту величину,
# которую потом платит заявитель.
#
# ⚠️ СТАВКИ ОРИЕНТИРОВОЧНЫЕ. Реальные утверждает региональный орган
# регулирования отдельным приказом на год. Перед защитой подставить
# действующий приказ по Москве — правится только этот блок.
# ---------------------------------------------------------------------------
connection_fee:
  basis: "ФЗ-190 ст. 14; ПП РФ № 787 от 05.07.2018"
  rates_source: "ориентировочные, приказ регионального регулятора не подставлен"
  calibrated: false

  thresholds_gcal_h:
    flat_fee_max: 0.1      # не более 0,1 Гкал/ч — фиксированная плата
    tariff_max: 1.5        # более 1,5 Гкал/ч — плата по индивидуальному проекту
  flat_fee_rub: 550        # с НДС, ФЗ-190 ст. 14
  vat_rate: 0.20

  # Ставка за подключаемую тепловую нагрузку, ₽ за Гкал/ч, без НДС
  load_rate_rub_per_gcal_h: 3100000

  # Ставка за протяжённость тепловых сетей, ₽/м без НДС, по Ду и типу прокладки.
  # Откалиброваны так, чтобы плата за подключение примерно покрывала смету СМР:
  # в этом и состоит её регуляторный смысл — возместить ТСО создание сетей.
  length_rate_rub_per_m:
    channelless:
      50:  22000
      100: 28000
      150: 35000
      200: 45000
      300: 63000
      500: 101000
    channel:
      50:  31000
      100: 40000
      150: 50000
      200: 64000
      300: 89000
      500: 144000

# ---------------------------------------------------------------------------
# Веса риска согласований (безразмерные, для Парето-фронта)
# ---------------------------------------------------------------------------
approval_risk_weights:
  foreign_parcels:      10.0   # за каждый пересечённый чужой участок
  roadway_opening_m:     0.05  # за метр вскрытия проезжей части
  protected_zones:      15.0   # за пересечение ЗОУИТ
  closed_crossings:      6.0   # за каждый закрытый переход
  reconstruction:       25.0   # если требуется перекладка существующей сети

# ---------------------------------------------------------------------------
# Профили — множители к базовым величинам. Дают три разных ответа (§10).
# ---------------------------------------------------------------------------
profiles:
  min_cost:
    title: "Минимальная стоимость"
    zone_penalty_scale: {private_parcel: 1.0, road_closed_method: 1.0}
    risk_weight: 0.2
  min_approvals:
    title: "Минимум согласований"
    zone_penalty_scale: {private_parcel: 6.0, road_closed_method: 3.0, protected_zone: 4.0}
    surface_multiplier_override: {street_major: 9.0, street_local: 5.0, utility_corridor: 0.6}
    risk_weight: 3.0
  reliable:
    title: "Надёжность и резерв"
    prefer_independent_source: true
    capacity_margin: 1.3       # запас пропускной способности точки врезки
    risk_weight: 1.0
