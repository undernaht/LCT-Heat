# Оценка тепловой нагрузки здания по геометрии.
#
# Укрупнённые удельные показатели — стартовое приближение, чтобы «оживить» весь
# загруженный район без ручного ввода. Если у пользователя есть проектная
# нагрузка, она вводится в UI и перекрывает расчёт.
#
# Методика — docs/04-algorithm.md §2.

meta:
  method: "Укрупнённые удельные показатели на м² общей площади"
  calibrated: false

# ---------------------------------------------------------------------------
# Климат. Расчётная температура наружного воздуха для проектирования отопления
# (параметры Б). Москва: −25 °C — СП 131.13330 «Строительная климатология».
# ---------------------------------------------------------------------------
climate:
  city: "Москва"
  t_outside_design_c: -25.0
  t_inside_c: 20.0
  t_cold_water_winter_c: 5.0
  t_dhw_c: 55.0
  # Базовая температура, для которой откалиброваны q_уд ниже.
  t_outside_base_c: -25.0

# ---------------------------------------------------------------------------
# Геометрия → площадь
# ---------------------------------------------------------------------------
geometry:
  usable_area_factor: 0.85       # общая площадь = контур × этажность × k
  default_floor_height_m: 3.0    # если этажность неизвестна, но известна высота
  default_floors: 5              # последний рубеж, если нет ни того, ни другого

# ---------------------------------------------------------------------------
# Удельный расход на отопление и вентиляцию, Вт/м² общей площади.
# Выбор строки: по use и этажности; для жилья — ещё по году постройки, если есть.
# ---------------------------------------------------------------------------
heating_w_per_m2:
  residential:
    - {floors_max: 3,  built_before: 2000, value: 105}
    - {floors_max: 3,  built_before: null, value: 70}
    - {floors_max: 9,  built_before: 2000, value: 82}
    - {floors_max: 9,  built_before: null, value: 58}
    - {floors_max: null, built_before: 2000, value: 75}
    - {floors_max: null, built_before: null, value: 52}
  public:
    - {floors_max: null, built_before: 2000, value: 95}
    - {floors_max: null, built_before: null, value: 72}
  industrial:
    - {floors_max: null, built_before: null, value: 60}
  other:
    - {floors_max: null, built_before: null, value: 70}

# ---------------------------------------------------------------------------
# Горячее водоснабжение
# ---------------------------------------------------------------------------
dhw:
  # Норма расхода на человека в сутки, л (жилые дома с ваннами и централизованным ГВС)
  consumption_l_per_person_day: 105
  # Обеспеченность жилой площадью, м²/чел — для оценки числа жителей
  area_per_person_m2: 30.0
  # Коэффициент часовой неравномерности (средний → максимальный час)
  hourly_peak_factor: 2.4
  # Для нежилых — доля от отопительной нагрузки (грубо, но лучше нуля)
  nonresidential_share_of_heating: 0.10

# ---------------------------------------------------------------------------
# Соответствие тегов OSM внутренним типам застройки
# ---------------------------------------------------------------------------
osm_building_use:
  residential: [residential, apartments, house, detached, dormitory, terrace,
                semidetached_house, bungalow]
  public: [commercial, office, retail, school, university, kindergarten,
           hospital, clinic, hotel, civic, public, government, sports_centre,
           college, museum, library, supermarket, mall]
  industrial: [industrial, warehouse, factory, manufacture]

# Здания, которые не отапливаются — нагрузка не считается.
osm_building_skip: [garage, garages, shed, roof, carport, hut, construction,
                    greenhouse, service, transformer_tower, water_tower, ruins]

# ---------------------------------------------------------------------------
# Единицы
# ---------------------------------------------------------------------------
units:
  # 1 Вт = 0,86e-6 Гкал/ч
  w_to_gcal_h: 0.00000086
